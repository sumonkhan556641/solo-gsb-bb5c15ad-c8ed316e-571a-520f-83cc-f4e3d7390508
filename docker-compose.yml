services:
  laser-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: lasercut-scheduler:latest
    container_name: lasercut-scheduler
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/lasercut.db
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-5242880}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    volumes:
      - laser-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  laser-data:
