<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sample plate for the laser cut path scheduler.
  Contains nested contours (plate -> holes -> boss holes), a rounded slot,
  plus an intentionally self-intersecting polygon and an open polyline so
  the validator has something to flag.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- outer plate -->
  <rect x="10" y="10" width="260" height="200" rx="12" ry="12"/>

  <!-- large circular hole with a smaller concentric hole (depth 2) -->
  <circle cx="90" cy="110" r="55"/>
  <circle cx="90" cy="110" r="22"/>

  <!-- rounded rectangular slot (rounded rect is converted via arcs) -->
  <rect x="170" y="60" width="80" height="46" rx="23" ry="23"/>

  <!-- freeform path using cubic curves, nested in the plate -->
  <path d="M 160 150
           C 160 130, 200 128, 210 150
           C 220 172, 180 182, 175 168
           C 172 160, 168 156, 160 150 Z"/>

  <!-- second simple part, separate island -->
  <rect x="300" y="20" width="80" height="80"/>
  <circle cx="340" cy="60" r="14"/>

  <!-- intentionally INVALID: self-intersecting bowtie -->
  <polygon points="300,150 380,250 380,150 300,250"/>

  <!-- intentionally INVALID: unclosed polyline -->
  <polyline points="300,270 330,250 360,275 390,255"/>
</svg>
